[project]
name = "autopredict-backend"
version = "0.1.0"
description = "AutoPredict simulation API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.115,<1.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
]

[tool.fastapi]
entrypoint = "app.main:app"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
