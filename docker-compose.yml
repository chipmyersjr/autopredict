services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autopredict}
      POSTGRES_USER: ${POSTGRES_USER:-autopredict}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autopredict_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  backend: &backend
    image: autopredict-backend:dev
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: ${ENV_FILE:-.env}
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/app:/app/backend/app
      - ./backend/alembic.ini:/app/backend/alembic.ini:ro
      - ./migrations:/app/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=4)"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  init:
    <<: *backend
    profiles: [tools]
    ports: []
    healthcheck:
      disable: true
    command:
      - /bin/sh
      - -ec
      - alembic upgrade head && python -m app.seed && python -m app.seed_strategy && python -m app.seed_user

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    env_file: frontend/.env.local
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend/src:/app/frontend/src
      - ./frontend/index.html:/app/frontend/index.html
      - ./frontend/vite.config.ts:/app/frontend/vite.config.ts
      - ./frontend/tsconfig.json:/app/frontend/tsconfig.json
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  postgres_data:
